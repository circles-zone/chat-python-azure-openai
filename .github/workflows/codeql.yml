  trigger-private-workflow:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger private workflow via API
        env:
          PAT: ${{ secrets.GHA_WORKFLOWS_WORKFLOWS_READ_WRITE_PAT }}
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $PAT" \
            https://api.github.com/repos/circles-zone/github-workflows/.github/workflows/codeql-analysis.yml/dispatches \
            -d '{"ref":"BU-2737-Implement-CodeQL-Farah-Mae-Sumajit","inputs":{"languages":"python,actions"}}'
